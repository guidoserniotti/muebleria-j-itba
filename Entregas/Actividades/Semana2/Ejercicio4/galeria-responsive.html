<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería Responsiva</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <h1>Nuestros Muebles</h1>
    <p class="ayuda">
      Cambiá el ancho de la ventana del navegador para ver cómo la galería pasa
      de una columna a varias.
    </p>

    <div class="galeria">
      <div class="tarjeta-foto">
        <img
          src="../../imagenes/sofa-patagonia.png"
          alt="Sofá Patagonia de tres cuerpos tapizado en pana"
        />
        <p>Sofá Patagonia</p>
      </div>

      <div class="tarjeta-foto">
        <img
          src="../../imagenes/mesa-comedor-pampa.png"
          alt="Mesa de comedor Pampa de madera maciza para seis personas"
        />
        <p>Mesa de Comedor Pampa</p>
      </div>

      <div class="tarjeta-foto">
        <img
          src="../../imagenes/biblioteca-recoleta.png"
          alt="Biblioteca Recoleta de cinco estantes en madera clara"
        />
        <p>Biblioteca Recoleta</p>
      </div>

      <div class="tarjeta-foto">
        <img
          src="../../imagenes/butaca-mendoza.png"
          alt="Butaca Mendoza individual con patas de madera"
        />
        <p>Butaca Mendoza</p>
      </div>

      <div class="tarjeta-foto">
        <img
          src="../../imagenes/escritorio-costa.png"
          alt="Escritorio Costa con cajonera lateral"
        />
        <p>Escritorio Costa</p>
      </div>

      <div class="tarjeta-foto">
        <img
          src="../../imagenes/mesa-noche-aconcagua.png"
          alt="Mesa de noche Aconcagua de dos cajones"
        />
        <p>Mesa de Noche Aconcagua</p>
      </div>
    </div>
  </body>
</html>
